#!/bin/bash 
. /root/dsnvps.conf
if [ -f /etc/dsnvps/domainquanly/domainquanly.conf ]; then
serverip_priport=$domainquanly
else
serverip_priport="${serverip}:${priport}"
fi
# Anti-debug removed
if [ -f /etc/dsnvps/.tmp/disable_function_curent ]; then
checkkitu=$(du -sb /etc/dsnvps/.tmp/disable_function_curent | awk 'NR==1 {print $1}')
if [ $checkkitu -gt 29 ]; then 
cat > "/etc/dsnvps/.tmp/re-enable-all-old-function.sh" <<END
#!/bin/bash
sed -i 's/.*disable_functions\ =.*/`cat /etc/dsnvps/.tmp/disable_function_curent`/g' /etc/php.ini
END
chmod +x /etc/dsnvps/.tmp/re-enable-all-old-function.sh
/etc/dsnvps/.tmp/re-enable-all-old-function.sh
rm -f /etc/dsnvps/.tmp/re-enable-all-old-function.sh
#service php-fpm restart
/etc/dsnvps/menu/inc/re-start-php-fpm-service 
fi
fi
rm -rf /etc/dsnvps/.tmp/disable_function_curent
rm -rf /etc/dsnvps/.tmp/disable_function_curent_check
