#!/bin/bash 
. /root/dsnvps.conf
if [ -f /etc/dsnvps/domainquanly/domainquanly.conf ]; then
serverip_priport=$domainquanly
else
serverip_priport="${serverip}:${priport}"
fi
# Anti-debug removed

UPPHP=$(/bin/systemctl status php-fpm.service | grep running | grep -v not | wc -l);

if [ "$UPPHP" -ne 1 ]; then
clear
echo "========================================================================"
echo "Hiện tại, dịch vụ PHP không chạy"; sleep 2
echo "------------------------------------------------------------------------"
echo "DSNVPS đang cố gắng khởi động nó"; sleep 2
echo "------------------------------------------------------------------------"
echo "Vui lòng chờ ..."; sleep 2
sleep 5 ; clear
	echo "-------------------------------------------------------------------------"
/etc/dsnvps/menu/inc/start-php-fpm-service
clear
echo "========================================================================"
echo "Kiểm tra lại dịch vụ PHP!"
echo "------------------------------------------------------------------------"
echo "Vui lòng chờ ..."
sleep 5 ; clear

UPPHP=$(/bin/systemctl status php-fpm.service | grep running | grep -v not | wc -l);

if [ "$UPPHP" -ne 1 ]; then
echo "========================================================================"
echo "DSNVPS không thể khởi động dịch vụ PHP"
sleep 4 ;
phpsetup=`command -v php >/dev/null 2>&1 && echo php-common`
    if [ -z "$phpsetup" ]; then
    /etc/dsnvps/menu/dsnvps-fix-loi-chua-cai-php
    else
	clear
	echo "========================================================================="
	echo "Xin lỗi, PHP-FPM đã dừng. Hãy BẬT lại trước khi sử dụng chức năng này!"
#echo "Xin lỗi, PHP-FPM đang dừng. Hãy Bật lên trước khi dùng chức năng này!"
/etc/dsnvps/menu/downloadlog/dsnvps-eroor-menu
     fi
fi
fi


if [ "$(grep "log_errors\ =" /etc/php.ini | awk 'NR==1 {print $3}')" == "On" ]; then
echo "========================================================================="
echo "Sử dụng chức năng này cấu hình On/Off ghi log của PHP"
echo "-------------------------------------------------------------------------"
echo "Mặc định: log_errors = On"
echo "-------------------------------------------------------------------------"
echo "Hiện tại: log_errors = On"
echo "-------------------------------------------------------------------------"
echo "Nếu file_uploads = Off, PHP sẽ không ghi file log error vào hệ thống."
   echo "========================================================================="
read -r -p "Bạn muốn đặt [log_errors = Off] ?  [y/N] " response
case $response in
    [yY][eE][sS]|[yY]) 
sed -i.bak "s,log_errors = On,log_errors = Off,g" /etc/php.ini
echo "-------------------------------------------------------------------------"
    echo "cho xiu..."
    rm -rf /home/$mainsite/logs/php-fpm*
touch /home/$mainsite/logs/php-fpm.log
chown -R nginx:nginx /home/$mainsite/logs/php-fpm.log
sleep 2
##Restart PHP
/etc/dsnvps/menu/inc/re-start-php-fpm-service
#######
    clear
   echo "========================================================================="
echo "Cấu hình [log_errors = Off] thành công !"
/etc/dsnvps/menu/downloadlog/dsnvps-eroor-menu
        ;;
    *)
       clear
    echo "========================================================================="
echo "Hủy bỏ !"
/etc/dsnvps/menu/downloadlog/dsnvps-eroor-menu
        ;;
esac
fi
if [ "$(grep "log_errors\ =" /etc/php.ini | awk 'NR==1 {print $3}')" == "Off" ]; then
echo "========================================================================="
echo "Sử dụng chức năng này cấu hình On/Off ghi log error của PHP"
echo "-------------------------------------------------------------------------"
echo "Mặc định: log_errors = On"
echo "-------------------------------------------------------------------------"
echo "Hiện tại: log_errors = Off"

   echo "========================================================================="
read -r -p "Ban muon dat [log_errors = On] ?  [y/N] " response
case $response in
    [yY][eE][sS]|[yY]) 
sed -i.bak "s,log_errors = Off,log_errors = On,g" /etc/php.ini
echo "-------------------------------------------------------------------------"
    echo "chờ xíu ..."
sleep 2
##Restart PHP
/etc/dsnvps/menu/inc/re-start-php-fpm-service
#######
    clear
   echo "========================================================================="
echo "Cấu hình [log_errors = On] thành công !"
/etc/dsnvps/menu/downloadlog/dsnvps-eroor-menu
        ;;
    *)
       clear
    echo "========================================================================="
echo "Hủy bỏ !"
/etc/dsnvps/menu/downloadlog/dsnvps-eroor-menu
        ;;
esac
fi
