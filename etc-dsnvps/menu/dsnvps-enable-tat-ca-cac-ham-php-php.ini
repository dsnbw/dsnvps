#!/bin/bash 
. /root/dsnvps.conf
if [ -f /etc/dsnvps/domainquanly/domainquanly.conf ]; then
serverip_priport=$domainquanly
else
serverip_priport="${serverip}:${priport}"
fi
# Anti-debug removed
rm -rf /etc/dsnvps/.tmp/disable_function_curent
rm -rf /etc/dsnvps/.tmp/disable_function_curent_check
grep disable_functions /etc/php.ini > /etc/dsnvps/.tmp/disable_function_curent_check
checkkitu=$(du -sb /etc/dsnvps/.tmp/disable_function_curent_check | awk 'NR==1 {print $1}')
if [ $checkkitu -gt 29 ]; then 
grep "disable_functions =" /etc/php.ini > /etc/dsnvps/.tmp/disable_function_curent
sed -i 's/.*disable_functions\ =.*/disable_functions =/g' /etc/php.ini

/etc/dsnvps/menu/inc/re-start-php-fpm-service 

fi
