server {
listen 80;
listen [::]:80;
server_name main_domain redirect_domain;
return       301 https://main_domain$request_uri;
}
server {
listen 443 ssl;
listen [::]:443 ssl;
http2 on;
http3 on;
server_name  redirect_domain;
return       301 https://main_domain$request_uri;
ssl_certificate /etc/nginx/auth-acme/main_domain/main_domain.crt;
ssl_certificate_key /etc/nginx/auth-acme/main_domain/main_domain.key;
ssl_trusted_certificate /etc/nginx/auth-acme/main_domain/main_domain.ca;
}
server {
listen 443 ssl;
listen [::]:443 ssl;
http2 on;
http3 on;
ssl_certificate /etc/nginx/auth-acme/main_domain/main_domain.crt;
ssl_certificate_key /etc/nginx/auth-acme/main_domain/main_domain.key;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
ssl_prefer_server_ciphers on;
include /etc/nginx/conf/ssl-protocol-cipher.conf;
#ssl_stapling on;
#ssl_stapling_verify on;
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 30s;
ssl_trusted_certificate /etc/nginx/auth-acme/main_domain/main_domain.ca;
ssl_buffer_size 1400;
ssl_session_tickets on;
add_header Strict-Transport-Security max-age=31536000;
access_log off;
#access_log   /home/main_domain/logs/access_log;
error_log off;
#error_log /home/main_domain/logs/error.log;
add_header X-Frame-Options SAMEORIGIN;
add_header X-Content-Type-Options nosniff;
add_header X-XSS-Protection "1; mode=block";
root /home/main_domain/public_html;
include /etc/nginx/conf/ddos2.conf;
index index.php index.html index.htm;
server_name main_domain;

#///////////////////////////////////////////////////////
# Ban chi co the chon 1 trong 4 rule AAA, BBB, CCC, DDD hoac EEE
