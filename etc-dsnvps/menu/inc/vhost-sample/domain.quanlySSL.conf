server {
listen 80;
listen [::]:80;
server_name domain.quanly;
return       301 https://domain.quanly$request_uri;
}


server {
listen 443 ssl;
listen [::]:443 ssl;
http2 on;
http3 on;
ssl_certificate /etc/nginx/paidssl/domain.quanly/domain.quanly.crt;
ssl_certificate_key /etc/nginx/paidssl/domain.quanly/domain.quanly.key;
ssl_trusted_certificate /etc/nginx/paidssl/domain.quanly/domain.quanly.ca;
ssl_session_timeout 4h;
ssl_session_tickets off;  
ssl_prefer_server_ciphers on;
include /etc/nginx/conf/ssl-protocol-cipherV2.conf;
ssl_ecdh_curve X25519:P-256:P-384:P-224:P-521;
ssl_buffer_size 1400;
add_header Alt-Svc 'h3-23=":443"';  # Advertise HTTP/3 support
add_header QUIC-Status "OK";
add_header Strict-Transport-Security "max-age=31536000; preload" always;
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 10s;
access_log off;
error_log off;
add_header X-Frame-Options SAMEORIGIN;
add_header X-Content-Type-Options nosniff;
add_header X-XSS-Protection "1; mode=block";
root /home/dsnvps.demo/private_html;
auth_basic "Authorization Required";
auth_basic_user_file  /etc/nginx/.htpasswd;
include /etc/nginx/conf/ddos2.conf;
index index.php index.html index.htm;
server_name domain.quanly;
     	location / {
		try_files $uri $uri/ /index.php;
   	    }
        location /nginx_status {
  		stub_status on;
  		access_log   off;
		}
    	location /php_status {
            	fastcgi_pass 127.0.0.1:9000;
            	fastcgi_index index.php;
            	fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            	include /etc/nginx/fastcgi_params;
    	}
    	location ~ \.php$ {
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
        	include /etc/nginx/fastcgi_params;
        	fastcgi_pass 127.0.0.1:9000;
        	fastcgi_index index.php;
			fastcgi_connect_timeout 1000;
			fastcgi_send_timeout 1000;
			fastcgi_read_timeout 1000;
			fastcgi_buffer_size 128k;
			fastcgi_buffers 8 128k;
			fastcgi_busy_buffers_size 256k;
			fastcgi_temp_file_write_size 128k;
			fastcgi_intercept_errors on;
        	fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    	}
        location ~* \.(bak|back|bk)$ {
		deny all;
	}
}