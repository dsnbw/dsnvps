server {
	    server_name redirect_domain;
	    return       301 http://main_domain$request_uri;
    	}
    	
server {
listen   80;
listen [::]:80;
access_log off;
#access_log   /home/main_domain/logs/access_log;
error_log off;
#error_log /home/main_domain/logs/error.log;	
add_header X-Frame-Options SAMEORIGIN;
add_header X-Content-Type-Options nosniff;
add_header X-XSS-Protection "1; mode=block";
root /home/main_domain/public_html;
include /etc/nginx/conf/ddos2.conf;
index index.php index.html index.htm;
server_name main_domain;
#include /etc/nginx/conf/block.conf;
include /etc/nginx/conf/drop.conf;
#set $proxy_backend https://main_vps_ip:443;
#include /home/main_domain/cache.d/*.conf;
    location / {
        proxy_pass https://main_vps_ip:443;
        
proxy_http_version 1.1;

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_set_header Host $host; 
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port $server_port;

proxy_buffer_size 128k;
proxy_buffers 4 256k; 
proxy_busy_buffers_size 256k;

proxy_connect_timeout 90s;
proxy_send_timeout 90s;
proxy_read_timeout 90s;

proxy_redirect off;
proxy_ssl_verify off;
proxy_ssl_server_name on;
    }
    }
