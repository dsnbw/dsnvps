server {
	    listen   80 default_server;
	    listen [::]:80 default_server;

    	access_log off;
    	error_log off;
    	# error_log /home/dsnvps.demo/logs/error.log;
    	root /home/dsnvps.demo/public_html;
include /etc/nginx/conf/ddos2.conf;
index index.php index.html index.htm;
server_name _;   


#///////////////////////////////////////////////////////
#Run all the websites,if you use your rule, comment or delete the line below (AAA)
include /etc/nginx/conf/all.conf;

#If you use your rule, comment or delete above line, and  Uncoment 3 lines belows and set your rule within it..
#location / {
#Uncomment 3 lines and set your rules here!
#} 

#security, sql injection Propeller ....(uncoment if you want to use). Because some website plugins do not run with this config, so dsnvps to turn off default
#include /etc/nginx/conf/block.conf;

    	location ~ \.php$ {
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
        	include /etc/nginx/fastcgi_params;
        	fastcgi_pass 127.0.0.1:9000;
        	fastcgi_index index.php;
		fastcgi_connect_timeout 150;
		fastcgi_send_timeout 180;
		fastcgi_read_timeout 180;
		fastcgi_buffer_size 128k;
		fastcgi_buffers 8 128k;
		fastcgi_busy_buffers_size 256k;
		fastcgi_temp_file_write_size 128k;
		fastcgi_intercept_errors on;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    	}

include /etc/nginx/conf/staticfiles.conf;
#include /etc/nginx/conf/phpstatus.conf;
include /etc/nginx/conf/drop.conf;

}
	
server {
	    listen   34618;
	 	access_log        off;
		log_not_found     off;
	 	error_log         off;
    	root /home/dsnvps.demo/private_html;
    	auth_basic "Authorization Required ( Get User & Password at /home/DSNVPS-manage-info.txt or Create new one by : DSNVPS menu -> Bao Mat Server & Website -> User & Password Mac Dinh )";
		auth_basic_user_file  /etc/nginx/.htpasswd;
	    index index.php index.html index.htm;
    	server_name _;
 
     	location / {
		try_files $uri $uri/ /index.php;
   	    }
        location /nginx_status {
  		stub_status on;
  		access_log   off;
		}
    	location /php_status {
            	fastcgi_pass 127.0.0.1:9000;
            	fastcgi_index index.php;
            	fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            	include /etc/nginx/fastcgi_params;
    	}
    	location ~ \.php$ {
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
        	include /etc/nginx/fastcgi_params;
        	fastcgi_pass 127.0.0.1:9000;
        	fastcgi_index index.php;
			fastcgi_connect_timeout 1000;
			fastcgi_send_timeout 1000;
			fastcgi_read_timeout 1000;
			fastcgi_buffer_size 128k;
			fastcgi_buffers 8 128k;
			fastcgi_busy_buffers_size 256k;
			fastcgi_temp_file_write_size 128k;
			fastcgi_intercept_errors on;
        	fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    	}
        location ~* \.(bak|back|bk)$ {
		deny all;
	}
}

server {
listen 443 ssl default_server;
listen [::]:443 ssl default_server;
http2 on;
http3 on;
ssl_certificate /etc/dsnvps/ssl/dsnvps.demo.crt;
ssl_certificate_key /etc/dsnvps/ssl/dsnvps.demo.key;
ssl_session_timeout 4h;
ssl_session_tickets off; 
ssl_prefer_server_ciphers on;
include /etc/nginx/conf/ssl-protocol-cipherV2.conf;
ssl_ecdh_curve X25519:P-256:P-384:P-224:P-521;
ssl_buffer_size 1400;
access_log off;
error_log off;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 10s;
root /home/$host/public_html;
include /etc/nginx/conf/ddos2.conf;
index index.php index.html index.htm;
server_name _;   
include /etc/nginx/conf/all.conf;
location ~ \.php$ {
fastcgi_split_path_info ^(.+\.php)(/.+)$;
include /etc/nginx/fastcgi_params;
fastcgi_pass 127.0.0.1:9000;
fastcgi_index index.php;
fastcgi_connect_timeout 150;
fastcgi_send_timeout 180;
fastcgi_read_timeout 180;
fastcgi_buffer_size 128k;
fastcgi_buffers 8 128k;
fastcgi_busy_buffers_size 256k;
fastcgi_temp_file_write_size 128k;
fastcgi_intercept_errors on;
fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
}
}