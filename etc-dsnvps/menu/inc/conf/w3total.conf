# ================= Cu h�nh W3 Total Cache - Page Cache (Disk Enhanced) =================

set $cache_uri $request_uri;

#  Kh�ng cache c�c request POST hoc URL c� query string
if ($request_method = POST) {
    set $cache_uri 'null cache';
}
if ($query_string != "") {
    set $cache_uri 'null cache';
}

#  Kh�ng cache c�c ng dn c bit
if ($request_uri ~* "(/wp-admin/|/xmlrpc.php|wp-(app|cron|login|register|mail).php|wp-.*\.php|index.php|sitemap(_index)?.xml|[a-z0-9_-]+-sitemap([0-9]+)?.xml)") {
    set $cache_uri 'null cache';
}

#  Kh�ng cache nu ngi d�ng � ng nhp hoc c� cookie comment
if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_logged_in") {
    set $cache_uri 'null cache';
}

#  Kh�ng cache cho c�c trang c bit ca WooCommerce / EDD
if ($request_uri ~* "(/cart|/checkout|/my-account|/wc-api|/edd-api)") {
    set $cache_uri 'null cache';
}

#  Phc v file cache nu hp l
location / {
    # W3 Total Cache to file theo dng:
    # /wp-content/cache/page_enhanced/example.com/path/_index.html
    # hoc dng gzip: _index.html_gzip

    try_files /wp-content/cache/page_enhanced/$host$uri/_index.html
              /wp-content/cache/page_enhanced/$host$uri/_index.html_gzip
              $uri $uri/ /index.php$is_args$args;
}

# Cho ph�p truy cp trc tip file cache (nu c�)
location ~* /wp-content/cache/page_enhanced/.*_index\.html(_gzip)?$ {
    add_header Vary Accept-Encoding;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

#  Bo mt: Chn truy cp file PHP trong th mc uploads hoc files
location ~* /(?:uploads|files)/.*\.php$ {
    deny all;
}

#  H tr rewrite cho Yoast SEO Sitemap (nu d�ng)
rewrite ^/sitemap_index\.xml$ /index.php?sitemap=1 last;
rewrite ^/([^/]+?)-sitemap([0-9]+)?\.xml$ /index.php?sitemap=$1&sitemap_n=$2 last;