location / {
    rewrite ^/(.*)/$ /$1 permanent;
    try_files $uri $uri/ /index.php?$args;
}

location ~* \.(?:cur|gif|gz|htc|ico|jpeg|jpg|mp4|ogg|ogv|png|svg|svgz|ttf|webm|woff|woff2)$ {
    try_files $uri $uri/ /index.php?$args;
    expires 2w;
    add_header Cache-Control "public";
    log_not_found off;
}

location ~* \.(?:css|js)$ {
    try_files $uri $uri/ /index.php?$args;
    expires 1w;
    add_header Cache-Control "public";
}