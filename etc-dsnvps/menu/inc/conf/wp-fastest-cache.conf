# WP Fastest Cache Configuration
set $cache_uri $request_uri;

# Không cache POST hoặc URL có query string
if ($request_method = POST) {
    set $cache_uri 'null cache';
}
if ($query_string != "") {
    set $cache_uri 'null cache';
}

# Không cache admin, login, các file PHP đặc biệt
if ($request_uri ~* "(/wp-admin/|/xmlrpc.php|wp-(app|cron|login|register|mail).php|wp-.*.php|index.php|sitemap(_index)?.xml|[a-z0-9_-]+-sitemap([0-9]+)?.xml)") {
    set $cache_uri 'null cache';
}

# Không cache khi người dùng đã đăng nhập hoặc có cookie comment
if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_logged_in") {
    set $cache_uri 'null cache';
}

# Không cache cho WooCommerce / EDD
if ($request_uri ~* "(/cart|/checkout|/my-account|/wc-api|/edd-api)") {
    set $cache_uri 'null cache';
}

# Serve cache nếu hợp lệ
location / {
    # WP Fastest Cache tạo file như sau:
    # /wp-content/cache/all/example.com/index.html
    # hoặc /wp-content/cache/all/example.com/path/to/page/index.html

    try_files /wp-content/cache/all/$host$uri/index.html
              /wp-content/cache/all/$host$uri/index.html.gz
              $uri $uri/ /index.php$is_args$args;
}

# Truy cập trực tiếp file cache (nếu có)
location ~* /wp-content/cache/all/.*\.html$ {
    add_header Vary Accept-Encoding;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

# Chặn truy cập file PHP trong uploads
location ~* /(?:uploads|files)/.*\.php$ {
    deny all;
}

# Rewrite Yoast SEO Sitemap (nếu dùng)
rewrite ^/sitemap_index\.xml$ /index.php?sitemap=1 last;
rewrite ^/([^/]+?)-sitemap([0-9]+)?\.xml$ /index.php?sitemap=$1&sitemap_n=$2 last;
