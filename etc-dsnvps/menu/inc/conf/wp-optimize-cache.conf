# ================= WP-Optimize Cache (Page Cache) =================

# Đặt mặc định không bỏ qua cache
set $skip_cache 0;

# Không cache nếu là POST hoặc có query string
if ($request_method = POST) {
    set $skip_cache 1;
}
if ($query_string != "") {
    set $skip_cache 1;
}

# Không cache admin, login, các file PHP đặc biệt
if ($request_uri ~* "(/wp-admin/|xmlrpc\.php|wp-(app|cron|login|register|mail)\.php|wp-.*\.php|index\.php|sitemap(_index)?\.xml|[a-z0-9_-]+-sitemap[0-9]*\.xml)") {
    set $skip_cache 1;
}

# Không cache nếu người dùng đã đăng nhập hoặc có cookie comment
if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_logged_in") {
    set $skip_cache 1;
}

# Không cache cho WooCommerce / EDD
if ($request_uri ~* "(/cart|/checkout|/my-account|wc-api|edd-api)") {
    set $skip_cache 1;
}

# Main location block
location / {
    # Đường dẫn file cache của WP-Optimize
    set $cache_file "/wp-content/cache/wpo-cache/$host$uri/index.html";

    # Nếu được cache → serve file cache, nếu không → fallback sang PHP
    try_files $skip_cache$cache_file $uri $uri/ /index.php$is_args$args;
}

# Truy cập trực tiếp file cache HTML nếu tồn tại
location ~* /wp-content/cache/wpo-cache/.*\.html$ {
    add_header Vary "Accept-Encoding, Cookie";
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

# Cache trình duyệt cho tài nguyên tĩnh
location ~* \.(css|js)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

# Bảo mật: Chặn truy cập file PHP trong uploads hoặc files
location ~* /(?:uploads|files)/.*\.php$ {
    deny all;
}

# Rewrite Yoast SEO sitemap nếu dùng
rewrite ^/sitemap_index\.xml$ /index.php?sitemap=1 last;
rewrite ^/([^/]+?)-sitemap([0-9]+)?\.xml$ /index.php?sitemap=$1&sitemap_n=$2 last;