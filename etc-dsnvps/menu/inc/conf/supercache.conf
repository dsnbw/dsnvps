# WP Super Cache Configuration
set $cache_uri $request_uri;

# POST requests v� URLs c� query string kh�ng cache
if ($request_method = POST) {
    set $cache_uri 'null cache';
}
if ($query_string != "") {
    set $cache_uri 'null cache';
}

# Kh�ng cache c�c URI n�y
if ($request_uri ~* "(/wp-admin/|/xmlrpc.php|/wp-(app|cron|login|register|mail).php|wp-.*.php|/feed/|index.php|wp-comments-popup.php|wp-links-opml.php|wp-locations.php|sitemap(_index)?.xml|[a-z0-9_-]+-sitemap([0-9]+)?.xml)") {
    set $cache_uri 'null cache';
}

# Kh�ng cache cho user � ng nhp hoc � comment
if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_logged_in") {
    set $cache_uri 'null cache';
}

# Kh�ng cache cho WooCommerce/EDD
if ($request_uri ~* "(/cart|/checkout|/my-account|/wc-api|/edd-api)") {
    set $cache_uri 'null cache';
}

# Nu request hp l  d�ng cache
location / {
    # https trc, u ti�n giao thc bo mt
    try_files /wp-content/cache/supercache/$host$uri/index-https.html
              /wp-content/cache/supercache/$host$uri/index.html
              $uri $uri/ /index.php$is_args$args;
}

# Truy cp trc tip file cache
location ~ /wp-content/cache/supercache/.*(index|index-https).html$ {
    try_files $uri =404;
}

# SECURITY : Deny all attempts to access PHP Files in the uploads directory
location ~* /(?:uploads|files)/.*\.php$ {
    deny all;
}

# PLUGINS : Enable Rewrite Rules for Yoast SEO SiteMap
rewrite ^/sitemap_index\.xml$ /index.php?sitemap=1 last;
rewrite ^/([^/]+?)-sitemap([0-9]+)?\.xml$ /index.php?sitemap=$1&sitemap_n=$2 last;