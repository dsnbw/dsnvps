
SecRequestBodyAccess On

# Đặt giới hạn số lượng request mỗi phút cho mỗi IP
SecAction "id:9001,phase:1,nolog,pass,t:none,setvar:tx.max_req_per_minute=200"

SecRule REQUEST_HEADERS:Host "@streq example.com" \
    "id:9002,phase:2,deny,status:429,msg:'Too many requests',\
    setvar:tx.req_count=+1,\
    chain"
    SecRule TX:req_count "@gt %{tx.max_req_per_minute}" \
    "t:none,setvar:tx.req_count=0"
