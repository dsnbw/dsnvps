#!/bin/bash
rm -rf /etc/dsnvps/.tmp/dsnvpsdishammuondis

grep "disable_functions =" /etc/php.ini | awk 'NR==1 {print $3}' > /etc/dsnvps/.tmp/function.php.check

# Đặt Config Mac Dinh xuống cuối
options=(
    "escapeshellarg" "escapeshellcmd" "exec" "ini_alter" "passthru" "pcntl_exec"
    "popen" "proc_close" "proc_get_status" "proc_nice" "proc_open" "proc_terminate"
    "show_source" "shell_exec" "symlink" "system" "dl" "leak" "openlog" "syslog"
    "readlink" "link" "putenv" "mail" "chown" "chgrp" "ini_set" "Hàm Nguy Hiểm Nên Tắt" 
    "Bật Tất Cả Hàm PHP"  # Thêm lựa chọn mới
)

menu() {
    clear
    RED='\e[31m'
    BOLD='\e[1m'
    RESET='\e[0m'
    echo "========================================================================="
    echo "Sử dụng chức năng này để cấu hình TẮT hàm PHP."
    echo "-------------------------------------------------------------------------"
    echo "Tất cả những hàm không có trong danh sách TẮT, tức là đang được BẬT"
    echo "-------------------------------------------------------------------------"
    echo "Nhập số + Nhấn [Enter] 1 lần + Nhập số khác để chọn nhiều hàm PHP."
    echo "-------------------------------------------------------------------------"
    echo "Lựa chọn hàm PHP xong, nhấn [ENTER] để kết thúc cấu hình."
    echo "========================================================================="
    echo "Hướng dẫn sử dụng: http://go.dsnvps/7759"
    echo "========================================================================="
    for i in "${!options[@]}"; do
        display_name="${options[i]}"
        if [[ "$display_name" == "Hàm Nguy Hiểm Nên Tắt" ]]; then
            printf "%3d%s) ${BOLD}${RED}%s${RESET}\n" $((i+1)) "${choices[i]:- }" "$display_name"
        else
            printf "%3d%s) %s\n" $((i+1)) "${choices[i]:- }" "$display_name"
        fi
    done
    [[ "$msg" ]] && echo "$msg"; :
}

prompt="Lựa chọn [1 - ${#options[@]}] hoặc 0 để thoát [Enter]: "

while menu && read -rp "$prompt" num; do
    # Nếu người dùng nhấn Enter (num rỗng) và đã có lựa chọn trước đó thì thoát vòng lặp
    if [[ -z "$num" ]]; then
        if [[ -n "${choices[*]}" ]]; then
            break
        else
            msg="===========================>>  Lựa chọn không chính xác !"
            continue
        fi
    fi

    if [[ "$num" == "0" ]]; then
        clear
        echo "========================================================================="
        echo "Bạn đã chọn thoát cấu hình TẮT hàm PHP."
        echo "-------------------------------------------------------------------------"
        /etc/dsnvps/menu/dsnvps-config-php.ini-menu
        exit 0
    fi

    # Kiểm tra lựa chọn hợp lệ
    [[ "$num" != *[![:digit:]]* ]] &&
    (( num > 0 && num <= ${#options[@]} )) ||
    { msg="===========================>> Lựa chọn không chính xác: $num"; continue; }

    # Thực hiện chức năng Bật Tất Cả Hàm PHP
    if [ "$num" == "${#options[@]}" ]; then
        echo "========================================================================="
        echo "Bạn đang chọn Bật tất cả các hàm PHP."
        echo "-------------------------------------------------------------------------"
        read -r -p "Bạn có chắc chắn muốn BẬT tất cả các hàm PHP không? [y/N] " response
        case $response in
            [yY][eE][sS]|[yY])
                echo "Bật tất cả các hàm PHP..."
                sed -i 's|.*disable_functions *=.*|disable_functions = |' /etc/php.ini
                /etc/dsnvps/menu/inc/re-start-php-fpm-service
                clear
                echo "========================================================================="
                echo "Đã bật tất cả các hàm PHP thành công"
                /etc/dsnvps/menu/dsnvps-config-php.ini-menu
                exit 0
                ;;
            *)
                echo "Quá trình BẬT tất cả các hàm PHP đã bị hủy."
                clear
                /etc/dsnvps/menu/dsnvps-config-php.ini-menu
                exit 0
                ;;
        esac
    fi

    # Thực hiện chức năng tắt hàm nguy hiểm
    if [ "$num" == "28" ]; then
        RED='\e[31m'
        BOLD='\e[1m'
        RESET='\e[0m'

        echo "========================================================================="
        echo -e "${BOLD}${RED}DSNVPS SẼ TẮT NHỮNG HÀM PHP (PHP FUNCTION) SAU:${RESET}"
        echo "-------------------------------------------------------------------------"
        echo -e "${BOLD}${RED}show_source${RESET}"
        echo "Hiển thị mã nguồn file PHP – nguy hiểm nếu bị lộ cấu hình hoặc"
        echo "thông tin nhạy cảm (ví dụ: mật khẩu DB)."
        echo "-------------------------------------------------------------------------"
        echo -e "${BOLD}${RED}dl${RESET}"
        echo "Tải extension PHP động trong thời gian chạy – dễ bị lợi dụng để"
        echo "chèn mã độc vào hệ thống."
        echo "-------------------------------------------------------------------------"
        echo -e "${BOLD}${RED}leak${RESET}"
        echo "Hàm dùng để kiểm thử bộ nhớ – không cần thiết trong môi trường"
        echo "production, có thể gây crash."
        echo "-------------------------------------------------------------------------"
        echo -e "${BOLD}${RED}symlink${RESET}"
        echo "Tạo symbolic link – có thể bị khai thác để truy cập trái phép vào"
        echo "các tệp nhạy cảm trên hệ thống."
        echo "-------------------------------------------------------------------------"
        echo -e "${BOLD}${RED}proc_terminate${RESET}"
        echo "Dừng một tiến trình – có thể bị lợi dụng để phá hoại hoặc tắt các"
        echo "tiến trình quan trọng."
        echo "========================================================================="
        read -r -p "Bạn muốn DSNVPS cấu hình TẮT những hàm PHP này ? [y/N] " response
        case $response in
            [yY][eE][sS]|[yY]) 
                echo "-------------------------------------------------------------------------"
                echo "Vui lòng chờ ..."; sleep 2
                sed -i 's|.*disable_functions *=.*|disable_functions = show_source,dl,leak,symlink,proc_terminate|' /etc/php.ini
                /etc/dsnvps/menu/inc/re-start-php-fpm-service
                clear
                echo "========================================================================="
                echo "Cấu hình TẮT [Hàm Nguy Hiểm Nên Tắt] thành công"
                /etc/dsnvps/menu/dsnvps-config-php.ini-menu
                exit 0
                ;;
            *)
                clear 
                echo "========================================================================= "
                echo "Bạn không thay đổi cấu hình TẮT hàm PHP !"
                /etc/dsnvps/menu/dsnvps-config-php.ini-menu
                exit 0
                ;;
        esac
    fi

    ((num--))
    if [[ "${choices[num]}" ]]; then
        choices[num]=""
        msg="===========================>> Bạn đã bỏ chọn hàm: ${options[num]}"
    else
        choices[num]="[X]"
        msg="===========================>> Bạn chọn disable hàm: ${options[num]}"
    fi

done

# Lưu lại các hàm PHP đã chọn
for i in ${!options[@]}; do 
    [[ "${choices[i]}" ]] && echo "${options[i]}" >> /etc/dsnvps/.tmp/dsnvpsdishammuondis
done

# Nếu không có lựa chọn nào, thoát
if [ ! -f /etc/dsnvps/.tmp/dsnvpsdishammuondis ]; then
    exit 0
fi

sofunctiondisable=$(cat /etc/dsnvps/.tmp/dsnvpsdishammuondis | wc -l)
if [ "$sofunctiondisable" -ne 1 ]; then
    functionnumber="Danh sách hàm PHP bạn chọn"
    hoithoai1="Bạn chắc chắn muốn TẮT những hàm PHP này?"
else
    functionnumber="Hàm PHP bạn chọn"
    hoithoai1="Bạn chắc chắn muốn TẮT hàm PHP này?"
fi   

echo "========================================================================="
echo "$functionnumber:"
echo "-------------------------------------------------------------------------"
cat /etc/dsnvps/.tmp/dsnvpsdishammuondis | pr -4 -t
echo "========================================================================="
read -r -p "$hoithoai1 [y/N] " response
case $response in
    [yY][eE][sS]|[yY]) 
        echo "-------------------------------------------------------------------------"
        echo "Vui lòng chờ ..."; sleep 2
        awk -F'\n' '{if(NR == 1) {printf $0} else {printf ","$0}}' /etc/dsnvps/.tmp/dsnvpsdishammuondis > /etc/dsnvps/.tmp/dsnvpsdislisthamdis
        dis_functions=$(cat /etc/dsnvps/.tmp/dsnvpsdislisthamdis)
        sed -i "s|.*disable_functions *=.*|disable_functions = ${dis_functions}|" /etc/php.ini
        /etc/dsnvps/menu/inc/re-start-php-fpm-service
        clear
        grep "disable_functions =" /etc/php.ini | sed 's/disable_functions =\ //' > /etc/dsnvps/.tmp/dsnvpsdislisthamdisfinish
        echo "========================================================================= "
        echo "Cấu hình TẮT hàm PHP thành công"
        rm -rf /etc/dsnvps/.tmp/dsnvpsdis*
        /etc/dsnvps/menu/dsnvps-config-php.ini-menu
        ;;
    *)
        clear 
        echo "========================================================================= "
        echo "Bạn không thay đổi cấu hình TẮT hàm PHP !"
        /etc/dsnvps/menu/dsnvps-config-php.ini-menu
        ;;
esac
